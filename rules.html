.auto main{visibility:hidden}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='stash-preview-key';
const ready=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true}));
async function open(raw){await ready;const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},k,u(P.ct)));
 document.open();document.write(html);document.close();}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.salt),iterations:P.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},true,['decrypt']);
 return new Uint8Array(await crypto.subtle.exportKey('raw',k));}
const saved=(()=>{try{return sessionStorage.getItem(K)||localStorage.getItem(K)}catch(e){return null}})();
if(saved){open(u(saved)).catch(()=>{document.documentElement.className='';try{sessionStorage.removeItem(K);localStorage.removeItem(K)}catch(e){}})}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');
 go.disabled=true;go.textContent='opening…';err.textContent='';
 try{const raw=await derive(document.getElementById('pw').value);const s=btoa(String.fromCharCode(...raw));
  await open(raw);try{sessionStorage.setItem(K,s);if(document.getElementById('keep')?.checked)localStorage.setItem(K,s)}catch(e){}}
 catch(x){go.disabled=false;go.textContent='open';err.textContent='that password didn’t work';}});
</script></body></html>
