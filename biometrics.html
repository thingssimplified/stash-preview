:root{--ink:#131c43;--muted:#6b6880;--violet:#6d28d9;--line:#e6e2f0;--paper:#fff;--err:#b42318}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}

input[type=password]:focus{border-color:var(--violet)}
button{margin-top:12px;width:100%;height:52px;border:0;border-radius:26px;background:var(--violet);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}
.err{color:var(--err);min-height:20px;margin:12px 0 0;font-size:14px}
.auto main{visibility:hidden}

<script>
(() => {
  const M = {"iter":600000,"salt":"uKOCI8dGCG0Zm4y9mPUSIA==","page":{"file":"151387c4d52ff.bin","assets":[]}};
  const K = 'stash-preview-key';
  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  // Start downloading the locked files straight away, while the password is typed.
  const get = (f) => fetch('p/' + f).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  const pageBytes = get(M.page.file);
  const assetBytes = M.page.assets.map((a) => get(a.file));
  pageBytes.catch(() => {}); assetBytes.forEach((p) => p.catch(() => {}));
  const open = (k, buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, k, new Uint8Array(buf, 12));
  async function unlock(raw) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const gz = await open(k, await pageBytes);
    let html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const urls = await Promise.all(M.page.assets.map(async (a, i) =>
      URL.createObjectURL(new Blob([await open(k, await assetBytes[i])], { type: a.type }))));
    urls.forEach((url, i) => { html = html.split('stash-asset-' + i + '-').join(url); });
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const root = document.documentElement;
    for (const at of [...root.attributes]) root.removeAttribute(at.name);
    for (const at of [...doc.documentElement.attributes]) root.setAttribute(at.name, at.value);
    document.head.replaceWith(document.adoptNode(doc.head));
    document.body.replaceWith(document.adoptNode(doc.body));
    // The site's pages may not declare their own viewport; keep the phone layout after the swap.
    if (!document.querySelector('meta[name=viewport]')) { const v = document.createElement('meta'); v.name = 'viewport'; v.content = 'width=device-width, initial-scale=1'; document.head.prepend(v); }
    // Parsed scripts never run; replace each with a fresh copy, in document order, so it runs once.
    for (const old of [...document.querySelectorAll('script')]) {
      const s = document.createElement('script');
      for (const at of [...old.attributes]) s.setAttribute(at.name, at.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    else scrollTo(0, 0);
  }
  async function derive(pw) {
    const b = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(M.salt), iterations: M.iter, hash: 'SHA-256' }, b, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    return new Uint8Array(await crypto.subtle.exportKey('raw', k));
  }
  const forget = () => { try { sessionStorage.removeItem(K); localStorage.removeItem(K); } catch (e) {} };
  let saved = null; try { saved = sessionStorage.getItem(K) || localStorage.getItem(K); } catch (e) {}
  if (saved) unlock(u8(saved)).catch(() => { forget(); document.documentElement.className = ''; });
  const f = document.getElementById('f');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; go.textContent = 'opening…'; err.textContent = '';
    let raw;
    try { raw = await derive(document.getElementById('pw').value); } catch (x) { raw = null; }
    const s = raw && btoa(String.fromCharCode(...raw));
    const keep = document.getElementById('keep').checked;
    try {
      await unlock(raw);
      try { sessionStorage.setItem(K, s); if (keep) localStorage.setItem(K, s); } catch (x) {}
    } catch (x) {
      go.disabled = false; go.textContent = 'open';
      err.textContent = x && x.name === 'OperationError' ? 'that password didn’t work' : 'couldn’t load the site, check your connection';
    }
  });
})();
